<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐릭터 프로필 메이커 · 사진형</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}
:root{
  --ink:#26262a; --muted:#8d8d93; --line:#e6e6e2; --soft:#f3f3f0; --bg:#e9e8e4; --accent:#3a6df0;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",Batang,serif;
}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}

/* ---------- 상단 툴바 ---------- */
.toolbar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;
  padding:12px 24px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.seg a{padding:6px 12px;border-radius:7px;font-size:13px;color:var(--muted);text-decoration:none}
.seg a.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg a:hover{color:var(--ink)}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand i{width:11px;height:11px;border-radius:50%;background:var(--ink);display:inline-block}
.seg{display:inline-flex;background:var(--soft);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button[data-font=serif]{font-family:var(--serif)}
.btn{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:9px;font-size:13px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#000}
.btn:disabled{opacity:.6;cursor:default}
button:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:12px;color:var(--muted);text-align:center;padding:14px 16px 0;line-height:1.6}

.stage{padding:18px 24px 64px;overflow-x:auto}

/* ---------- 프로필 카드 ---------- */
.card{position:relative;width:1440px;margin:0 auto;background:#fff;padding:44px 40px 40px;
  display:flex;align-items:stretch;overflow:hidden;font-family:var(--sans);
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 14px 40px rgba(0,0,0,.07)}
.card.serif{font-family:var(--serif)}
.vdivider{width:1px;flex:none;background:#e9e9e6;margin:0 24px}
.half{flex:1;min-width:0;display:flex;gap:24px}
.half.mirror{flex-direction:row-reverse}

.main-col{width:300px;flex:none;display:flex;flex-direction:column}
.info-col{flex:1;min-width:0;display:flex;flex-direction:column}

/* 사진 */
.photo{position:relative;overflow:hidden;background:var(--soft);cursor:pointer;user-select:none}
.photo.main{flex:1;min-height:720px;border-radius:3px}
.photo.head{width:128px;height:128px;flex:none;border-radius:50%}
.photo img{position:absolute;max-width:none;display:none;pointer-events:none}
.photo.has-img{cursor:grab;touch-action:none;background:#fff}
.photo.has-img.dragging{cursor:grabbing}
.photo.has-img img{display:block}
.photo.drop{box-shadow:inset 0 0 0 2px var(--accent)}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  color:#a6a6a1;font-size:13px;text-align:center;line-height:1.5;font-family:var(--sans)}
.photo.head .ph{font-size:11px;gap:4px}
.photo.has-img .ph{display:none}
.photo-ctrl{position:absolute;display:none;gap:4px}
.photo.main .photo-ctrl{right:10px;bottom:10px}
.photo.head .photo-ctrl{left:50%;bottom:12px;transform:translateX(-50%)}
.photo.has-img:hover .photo-ctrl{display:flex}
@media (hover:none){.photo.has-img .photo-ctrl{display:flex}}
.photo-ctrl button{width:28px;height:28px;border:0;border-radius:8px;background:rgba(20,20,22,.72);color:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center}
.photo-ctrl button:hover{background:rgba(20,20,22,.9)}

/* 이름 / 키 / 나이 */
/* 출처 표기 */
.credit{margin-top:7px;font-size:11px;line-height:1.5;color:#9a9a9f;font-family:var(--sans)}
.card.serif .credit{font-family:var(--serif)}
.credit-box{display:flex;align-items:baseline;gap:3px;max-width:100%}
.mirror .credit-box{justify-content:flex-end}
.c-mark{flex:none}
.c-text{min-width:3em;overflow-wrap:anywhere}
.c-del{flex:none;border:0;background:transparent;color:#b4b4b0;cursor:pointer;font-size:13px;line-height:1;padding:0 2px;opacity:0;transition:opacity .15s}
.credit:hover .c-del,.c-del:focus-visible{opacity:1}
@media (hover:none){.c-del{opacity:1}}
.c-del:hover{color:#c2402f}
.c-add{display:none;border:0;background:transparent;color:#b4b4b0;font-size:11px;cursor:pointer;padding:0}
.c-add:hover{color:var(--ink)}
.mirror .credit{text-align:right}
.credit.off .credit-box{display:none}
.credit.off .c-add{display:inline-block}
.head-wrap{display:flex;flex-direction:column;align-items:flex-start;width:128px;flex:none}
.mirror .head-wrap{align-items:flex-end}
.head-wrap .credit{width:100%}
.exporting .credit.off,.exporting .credit.blank{display:none}
.name-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-top:10px}
.mirror .name-row{justify-content:flex-end}
.name{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.2;min-width:1em}
.meta{font-size:15px;color:#6f6f74;display:inline-flex;align-items:baseline;gap:6px}
.meta .slash{color:#c4c4c0}
.field{min-width:1em}

/* 두상 + 팔레트 */
.head-row{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.mirror .head-row{flex-direction:row-reverse}
.sw-groups{display:flex;flex-direction:column;gap:10px}
.sw-group{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.mirror .sw-group{align-items:flex-end}
.sw-row{position:relative;display:flex}
.sw-list{display:flex;gap:6px}
.mirror .sw-list{flex-direction:row-reverse}
.sw{width:30px;height:30px;border-radius:4px;border:1px solid rgba(0,0,0,.12);cursor:pointer}
.sw.active{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
.sw-label{font-size:11px;color:var(--muted);letter-spacing:.02em;min-width:2em}
.mirror .sw-label{text-align:right}
.sw-btns{position:absolute;top:50%;transform:translateY(-50%);left:calc(100% + 6px);display:flex;gap:2px;opacity:.35;transition:opacity .15s}
.mirror .sw-btns{left:auto;right:calc(100% + 6px)}
.sw-group:hover .sw-btns,.sw-btns:focus-within{opacity:1}
@media (hover:none){.sw-btns{opacity:1}}
.sw-btns button{width:18px;height:18px;padding:0;border:1px solid var(--line);background:#fff;border-radius:5px;
  font-size:12px;line-height:1;cursor:pointer;color:#55555a;font-family:var(--sans)}
.sw-btns button:disabled{opacity:.3;cursor:default}

/* 텍스트 박스 */
.tbox{padding:2px 0}
.t-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.t-title{font-size:17px;font-weight:700;letter-spacing:-.01em;min-width:2em}
.t-count{font-size:11px;color:#b4b4b0;font-family:var(--sans);flex:none}
.t-count.full{color:#c2402f}
.exporting .t-count{display:none}
/* 추가 사진 칸 */
.extra-photos{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}
.photo.sub{width:100%;aspect-ratio:4/5;border-radius:3px}
.photo.sub .ph{font-size:12px}
.t-body{font-size:14px;line-height:1.75;min-height:1.75em;word-break:keep-all;overflow-wrap:anywhere;color:#38383c}
.card.serif .t-body{line-height:1.85}
.hdivider{height:1px;background:#e6e6e2;margin:20px 0}
.t-body b,.t-body strong{font-weight:700;color:var(--ink)}

[contenteditable]{outline:none;border-radius:3px;cursor:text}
[contenteditable]:hover{background:rgba(0,0,0,.025)}
[contenteditable]:focus{background:rgba(58,109,240,.05)}
[contenteditable][data-ph]:empty::before{content:attr(data-ph);color:#bdbdb8;pointer-events:none}

/* 스티커 */
.sticker-layer{position:absolute;inset:0;pointer-events:none;z-index:5}
.sticker{position:absolute;pointer-events:auto;cursor:move;touch-action:none;user-select:none}
.sticker img{width:100%;height:100%;display:block;pointer-events:none}
.sticker.sel{outline:1.5px dashed var(--accent);outline-offset:3px}
.stk-h{position:absolute;display:none;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;
  background:#fff;border:1.5px solid var(--accent);color:var(--accent);font-size:13px;line-height:1;font-family:var(--sans)}
.sticker.sel .stk-h{display:flex}
.stk-del{top:-14px;right:-14px;cursor:pointer;background:var(--accent);color:#fff}
.stk-size{bottom:-14px;right:-14px;cursor:nwse-resize}
.stk-rot{top:-40px;left:50%;margin-left:-11px;cursor:grab}

/* 저장할 때 숨길 것들 */
.exporting .ph,.exporting .sw-btns,.exporting .photo-ctrl{display:none!important}
.exporting [contenteditable]{background:transparent!important}
.exporting [contenteditable][data-ph]:empty::before{content:none}

/* 서식 바 */
.fmt{position:fixed;z-index:120;display:none;align-items:center;gap:2px;padding:4px;background:#26262a;border-radius:10px;
  transform:translate(-50%,calc(-100% - 10px));box-shadow:0 8px 24px rgba(0,0,0,.2)}
.fmt.show{display:flex}
.fmt button{border:0;background:transparent;color:#fff;height:28px;min-width:28px;padding:0 6px;border-radius:7px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:12px}
.fmt button:hover,.fmt button.on{background:rgba(255,255,255,.14)}
.fmt i{width:16px;height:16px;border-radius:50%;display:block;border:1px solid rgba(255,255,255,.3)}
.fmt-sep{width:1px;height:18px;background:rgba(255,255,255,.18);margin:0 3px}

/* 컬러 피커 팝업 */
.picker{position:absolute;z-index:110;width:236px;background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 14px 36px rgba(0,0,0,.16);padding:12px;display:none;font-family:var(--sans)}
.picker.show{display:block}
.sv{position:relative;height:144px;border-radius:8px;cursor:crosshair;touch-action:none}
.sv::before,.sv::after{content:"";position:absolute;inset:0;border-radius:8px}
.sv::before{background:linear-gradient(to right,#fff,rgba(255,255,255,0))}
.sv::after{background:linear-gradient(to top,#000,rgba(0,0,0,0))}
.sv-knob,.hue-knob{position:absolute;width:14px;height:14px;border:2px solid #fff;border-radius:50%;
  box-shadow:0 0 0 1px rgba(0,0,0,.35);transform:translate(-50%,-50%);z-index:2;pointer-events:none}
.hue{position:relative;height:12px;margin-top:12px;border-radius:6px;cursor:pointer;touch-action:none;
  background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.hue-knob{top:50%}
.pk-label{font-size:11px;color:var(--muted);margin:12px 0 6px}
.pk-row{display:flex;align-items:center;gap:8px}
.pk-prev{width:30px;height:30px;border-radius:6px;border:1px solid rgba(0,0,0,.1);flex:none}
.pk-hex{flex:1;display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;padding:0 8px;height:30px;font-size:13px}
.pk-hex:focus-within{border-color:var(--accent)}
.pk-hex span{color:var(--muted)}
.pk-hex input{border:0;outline:0;width:100%;font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase;padding-left:3px;background:transparent}
.pk-icon{width:30px;height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.pk-icon:hover{background:var(--soft)}
.pk-actions{display:flex;justify-content:space-between;margin-top:12px;gap:6px}
.pk-actions .btn{padding:6px 12px}
.pk-del{color:#c2402f}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#26262a;color:#fff;font-size:13px;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:200}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="toolbar">
  <div class="brand"><i></i>캐릭터 프로필 메이커</div>
  <nav class="seg" aria-label="버전"><a href="index.html">텍스트형</a><a href="photo.html" class="on">사진형</a></nav>
  <div class="seg" id="fontSeg" role="group" aria-label="글꼴">
    <button type="button" data-font="sans" class="on">프리텐다드</button>
    <button type="button" data-font="serif">명조</button>
  </div>
  <button type="button" class="btn" id="addSticker">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3H6a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h9.5L21 15.5V6a3 3 0 0 0-3-3z"/><path d="M21 15h-3a3 3 0 0 0-3 3v3"/></svg>
    스티커 추가
  </button>
  <button type="button" class="btn primary" id="savePng">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
    PNG로 저장
  </button>
  <input type="file" id="stickerInput" accept="image/png,image/webp,image/gif,image/*" multiple hidden>
</header>

<p class="hint">본문 칸은 각각 5줄까지 쓸 수 있어요. 사진은 클릭해서 넣고, 드래그로 위치 · 휠로 크기를 조절해요. 글자를 드래그하면 굵게 · 형광펜 메뉴가 떠요. 스티커는 선택 후 Delete 키로도 지울 수 있어요.</p>

<main class="stage">
  <div class="card" id="card">
    <div id="slotL"></div>
    <div class="vdivider"></div>
    <div id="slotR"></div>
    <div class="sticker-layer" id="stickerLayer"></div>
  </div>
</main>

<template id="halfTpl">
  <section class="half">
    <div class="main-col">
      <div class="photo main" data-photo>
        <img alt="" draggable="false">
        <div class="ph">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
          <span>클릭하거나 끌어다 놓아<br>이미지 넣기</span>
        </div>
        <div class="photo-ctrl" data-html2canvas-ignore>
          <button type="button" data-act="change" title="사진 변경"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></button>
          <button type="button" data-act="reset" title="위치 · 크기 초기화"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
        </div>
        <input type="file" accept="image/*" hidden>
      </div>
      <div class="credit">
        <div class="credit-box"><span class="c-mark">©</span><span class="c-text one" contenteditable="true" data-ph="작가명 / 출처"></span><button type="button" class="c-del" data-html2canvas-ignore title="출처 칸 삭제">×</button></div>
        <button type="button" class="c-add" data-html2canvas-ignore>+ 출처 표기 추가</button>
      </div>
      <div class="name-row">
        <span class="name one" contenteditable="true" data-ph="이름"></span>
        <span class="meta">
          <span class="field one" contenteditable="true" data-ph="키"></span>
          <span class="slash">/</span>
          <span class="field one" contenteditable="true" data-ph="나이"></span>
        </span>
      </div>
    </div>

    <div class="info-col">
      <div class="head-row">
        <div class="head-wrap">
        <div class="photo head" data-photo>
          <img alt="" draggable="false">
          <div class="ph">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            <span>두상 이미지</span>
          </div>
          <div class="photo-ctrl" data-html2canvas-ignore>
            <button type="button" data-act="change" title="사진 변경"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></button>
            <button type="button" data-act="reset" title="위치 · 크기 초기화"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
          </div>
          <input type="file" accept="image/*" hidden>
        </div>
        <div class="credit">
          <div class="credit-box"><span class="c-mark">©</span><span class="c-text one" contenteditable="true" data-ph="작가명 / 출처"></span><button type="button" class="c-del" data-html2canvas-ignore title="출처 칸 삭제">×</button></div>
          <button type="button" class="c-add" data-html2canvas-ignore>+ 출처 표기 추가</button>
        </div>
        </div>
        <div class="sw-groups">
          <div class="sw-group" data-group="hair">
            <div class="sw-row">
              <div class="sw-list"></div>
              <div class="sw-btns" data-html2canvas-ignore>
                <button type="button" data-sw="add" title="색 추가 (최대 3개)">+</button>
                <button type="button" data-sw="del" title="마지막 색 삭제">−</button>
              </div>
            </div>
            <div class="sw-label one" contenteditable="true">hair</div>
          </div>
          <div class="sw-group" data-group="eye">
            <div class="sw-row">
              <div class="sw-list"></div>
              <div class="sw-btns" data-html2canvas-ignore>
                <button type="button" data-sw="add" title="색 추가 (최대 3개)">+</button>
                <button type="button" data-sw="del" title="마지막 색 삭제">−</button>
              </div>
            </div>
            <div class="sw-label one" contenteditable="true">eye</div>
          </div>
        </div>
      </div>

      <div class="tbox">
        <div class="t-head"><div class="t-title one" contenteditable="true" data-ph="제목">외형</div><span class="t-count" data-html2canvas-ignore>0 / 5줄</span></div>
        <div class="t-body rich" contenteditable="true" data-ph="외형을 자유롭게 적어 주세요."></div>
      </div>
      <div class="hdivider"></div>
      <div class="tbox">
        <div class="t-head"><div class="t-title one" contenteditable="true" data-ph="제목">기타 사항</div><span class="t-count" data-html2canvas-ignore>0 / 5줄</span></div>
        <div class="t-body rich" contenteditable="true" data-ph="추가 사항을 자유롭게 적어 주세요."></div>
      </div>
      <div class="extra-photos">
        <div class="slot">

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const card = $('#card');

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- 좌우 반쪽 생성 ---------- */
const tpl = $('#halfTpl');
const leftHalf = tpl.content.firstElementChild.cloneNode(true);
const rightHalf = tpl.content.firstElementChild.cloneNode(true);
rightHalf.classList.add('mirror');
$('#slotL').replaceWith(leftHalf);
$('#slotR').replaceWith(rightHalf);
const DEFAULTS = [{hair:'#3a3330', eye:'#8a6b4f'}, {hair:'#d9c6a5', eye:'#5b7fb5'}];

/* ---------- 사진: 불러오기 / 드래그 / 휠 ---------- */
function setupPhoto(el){
  const img = $('img', el), input = $('input[type=file]', el);
  // ox, oy: 이미지 중심이 칸 중심에서 얼마나 벗어났는지 (칸 크기 대비 비율)
  const st = { nw:0, nh:0, zoom:1, ox:0, oy:0 };
  const geom = () => {
    const cw = el.clientWidth, ch = el.clientHeight;
    const s = Math.max(cw / st.nw, ch / st.nh) * st.zoom;
    return { cw, ch, W: st.nw * s, H: st.nh * s };
  };
  const posOf = g => ({ l: (g.cw - g.W) / 2 + st.ox * g.cw, t: (g.ch - g.H) / 2 + st.oy * g.ch });
  // 이미지가 칸 밖으로 완전히 사라지지 않도록 최소 40px은 걸치게
  const setPos = (g, l, t) => {
    l = clamp(l, -g.W + 40, g.cw - 40);
    t = clamp(t, -g.H + 40, g.ch - 40);
    st.ox = (l - (g.cw - g.W) / 2) / g.cw;
    st.oy = (t - (g.ch - g.H) / 2) / g.ch;
  };
  const reset = () => { st.zoom = 1; st.ox = st.oy = 0; };
  const layout = () => {
    if (!st.nw) return;
    const g = geom(), p = posOf(g);
    img.style.width = g.W + 'px'; img.style.height = g.H + 'px';
    img.style.left = p.l + 'px'; img.style.top = p.t + 'px';
  };
  new ResizeObserver(layout).observe(el);

  const loadFile = f => {
    if (!f || !f.type.startsWith('image/')) return;
    const r = new FileReader();
    r.onload = () => {
      img.onload = () => {
        st.nw = img.naturalWidth; st.nh = img.naturalHeight;
        reset();
        el.classList.add('has-img'); layout();
      };
      img.src = r.result;
    };
    r.readAsDataURL(f);
  };
  input.addEventListener('change', () => { loadFile(input.files[0]); input.value = ''; });

  el.addEventListener('click', e => {
    const b = e.target.closest('button[data-act]');
    if (b){
      e.stopPropagation();
      if (b.dataset.act === 'change') input.click();
      else { reset(); layout(); }
      return;
    }
    if (!st.nw) input.click();
  });

  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drop'); });
  el.addEventListener('dragleave', () => el.classList.remove('drop'));
  el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('drop'); loadFile(e.dataTransfer.files[0]); });

  let drag = null;
  el.addEventListener('pointerdown', e => {
    if (!st.nw || e.button !== 0 || e.target.closest('button')) return;
    const p = posOf(geom());
    drag = { x:e.clientX, y:e.clientY, l:p.l, t:p.t };
    el.setPointerCapture(e.pointerId); el.classList.add('dragging');
  });
  el.addEventListener('pointermove', e => {
    if (!drag) return;
    setPos(geom(), drag.l + e.clientX - drag.x, drag.t + e.clientY - drag.y);
    layout();
  });
  const end = () => { drag = null; el.classList.remove('dragging'); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);

  el.addEventListener('wheel', e => {
    if (!st.nw) return;
    e.preventDefault();
    const r = el.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const g = geom(), p = posOf(g);
    const ux = (mx - p.l) / g.W, uy = (my - p.t) / g.H;
    st.zoom = clamp(st.zoom * Math.exp(-e.deltaY * 0.0015), 0.2, 8);
    const g2 = geom();
    setPos(g2, mx - ux * g2.W, my - uy * g2.H);
    layout();
  }, { passive:false });
}
$$('[data-photo]').forEach(setupPhoto);

/* ---------- 텍스트 박스 5줄 제한 ---------- */
const MAX_LINES = 5;
const lineCount = body => {
  if (!body.textContent) return 0;
  const lh = parseFloat(getComputedStyle(body).lineHeight);
  return Math.round(body.scrollHeight / lh);
};
function refreshCount(body){
  const n = lineCount(body);
  const c = $('.t-count', body.closest('.tbox'));
  c.textContent = `${n} / ${MAX_LINES}줄`;
  c.classList.toggle('full', n >= MAX_LINES);
  return n;
}
$$('.t-body', card).forEach(body => {
  let last = body.innerHTML;
  body.addEventListener('input', () => {
    if (lineCount(body) > MAX_LINES){
      document.execCommand('undo');
      if (lineCount(body) > MAX_LINES) body.innerHTML = last;
      toast(`이 칸은 ${MAX_LINES}줄까지 쓸 수 있어요.`);
    }
    last = body.innerHTML;
    refreshCount(body);
  });
  refreshCount(body);
});
function recheckAll(){
  let over = false;
  $$('.t-body', card).forEach(b => { if (refreshCount(b) > MAX_LINES) over = true; });
  if (over) toast('글꼴이 바뀌어 5줄을 넘은 칸이 있어요. 내용을 조금 줄여 주세요.');
}

/* ---------- 출처 표기 ---------- */
$$('.credit', card).forEach(c => {
  $('.c-del', c).addEventListener('click', () => c.classList.add('off'));
  $('.c-add', c).addEventListener('click', () => { c.classList.remove('off'); $('.c-text', c).focus(); });
});

/* ---------- 색 변환 ---------- */
function hsvToHex(h, s, v){
  const f = n => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
  return '#' + [f(5), f(3), f(1)].map(x => Math.round(x * 255).toString(16).padStart(2, '0')).join('');
}
function normHex(str){
  let h = (str || '').trim().replace(/^#/, '');
  if (/^[0-9a-f]{3}$/i.test(h)) h = h.split('').map(c => c + c).join('');
  return /^[0-9a-f]{6}$/i.test(h) ? '#' + h.toLowerCase() : null;
}
function hexToHsv(hex){
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d){
    if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return { h, s: mx ? d / mx : 0, v: mx };
}

/* ---------- 컬러 피커 팝업 ---------- */
const Picker = (() => {
  const el = $('#picker'), sv = $('#pkSV'), svK = $('.sv-knob', sv), hue = $('#pkHue'), hueK = $('.hue-knob', hue);
  const hex = $('#pkHex'), prev = $('#pkPrev'), del = $('#pkDel'), drop = $('#pkDrop');
  let h = 0, s = 0, v = 0, onChange = null, onDelete = null, anchor = null;

  function paint(color, skipHex){
    sv.style.background = `hsl(${h},100%,50%)`;
    svK.style.left = s * 100 + '%'; svK.style.top = (1 - v) * 100 + '%';
    hueK.style.left = h / 360 * 100 + '%';
    const c = color || hsvToHex(h, s, v);
    prev.style.background = c;
    if (!skipHex) hex.value = c.slice(1).toUpperCase();
    if (onChange) onChange(c);
  }
  function setHex(c, skipHex){ ({ h, s, v } = hexToHsv(c)); paint(c, skipHex); }

  function track(area, fn){
    area.addEventListener('pointerdown', e => {
      area.setPointerCapture(e.pointerId);
      const move = ev => { const r = area.getBoundingClientRect(); fn(clamp((ev.clientX - r.left) / r.width, 0, 1), clamp((ev.clientY - r.top) / r.height, 0, 1)); };
      move(e);
      area.onpointermove = move;
      area.onpointerup = area.onpointercancel = () => { area.onpointermove = null; };
    });
  }
  track(sv, (x, y) => { s = x; v = 1 - y; paint(); });
  track(hue, x => { h = x * 359.9; paint(); });

  hex.addEventListener('input', () => { const c = normHex(hex.value); if (c) setHex(c, true); });
  hex.addEventListener('keydown', e => { if (e.key === 'Enter') close(); });
  hex.addEventListener('blur', () => { hex.value = hsvToHex(h, s, v).slice(1).toUpperCase(); });

  if ('EyeDropper' in window){
    drop.hidden = false;
    drop.addEventListener('click', async () => {
      try { const r = await new EyeDropper().open(); const c = normHex(r.sRGBHex); if (c) setHex(c); } catch (_) {}
    });
  }
  del.addEventListener('click', () => { const d = onDelete; close(); d && d(); });
  $('#pkDone').addEventListener('click', close);

  function open(anc, color, change, remove){
    if (anchor) anchor.classList.remove('active');
    anchor = anc; anchor.classList.add('active');
    onChange = null; setHex(color); onChange = change;
    onDelete = remove; del.style.visibility = remove ? 'visible' : 'hidden';
    el.classList.add('show');
    const r = anc.getBoundingClientRect();
    const w = el.offsetWidth;
    el.style.left = clamp(r.left + r.width / 2 - w / 2 + scrollX, 8 + scrollX, innerWidth - w - 8 + scrollX) + 'px';
    el.style.top = r.bottom + 10 + scrollY + 'px';
  }
  function close(){
    el.classList.remove('show');
    if (anchor) anchor.classList.remove('active');
    anchor = onChange = onDelete = null;
  }
  document.addEventListener('pointerdown', e => {
    if (el.classList.contains('show') && !el.contains(e.target) && !e.target.closest('.sw')) close();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  return { open, close };
})();

/* ---------- 팔레트 (기본 1개, 최대 3개) ---------- */
function setupSwatches(group, initial){
  const list = $('.sw-list', group), addB = $('[data-sw=add]', group), delB = $('[data-sw=del]', group);
  const colors = [initial];
  function openFor(i){
    const sw = list.children[i];
    Picker.open(sw, colors[i],
      c => { colors[i] = c; sw.style.background = c; sw.title = c.toUpperCase(); },
      colors.length > 1 ? () => { colors.splice(i, 1); render(); } : null);
  }
  function render(){
    list.innerHTML = '';
    colors.forEach((c, i) => {
      const sw = document.createElement('div');
      sw.className = 'sw'; sw.tabIndex = 0; sw.setAttribute('role', 'button');
      sw.style.background = c; sw.title = c.toUpperCase();
      sw.addEventListener('click', e => { e.stopPropagation(); openFor(i); });
      sw.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openFor(i); } });
      list.appendChild(sw);
    });
    addB.disabled = colors.length >= 3;
    delB.disabled = colors.length <= 1;
  }
  addB.addEventListener('click', e => {
    e.stopPropagation();
    if (colors.length >= 3) return;
    colors.push(colors[colors.length - 1]); render(); openFor(colors.length - 1);
  });
  delB.addEventListener('click', e => {
    e.stopPropagation();
    if (colors.length <= 1) return;
    Picker.close(); colors.pop(); render();
  });
  render();
}
[leftHalf, rightHalf].forEach((half, i) => {
  setupSwatches($('[data-group=hair]', half), DEFAULTS[i].hair);
  setupSwatches($('[data-group=eye]', half), DEFAULTS[i].eye);
});

/* ---------- 글꼴 전환 ---------- */
$$('#fontSeg button').forEach(b => b.addEventListener('click', () => {
  $$('#fontSeg button').forEach(x => x.classList.toggle('on', x === b));

}));

/* ---------- 텍스트 편집 공통 ---------- */
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('one') && e.key === 'Enter'){ e.preventDefault(); t.blur(); }
});
document.addEventListener('paste', e => {
  const t = e.target.closest && e.target.closest('[contenteditable]');
  if (!t) return;
  e.preventDefault();
  let text = e.clipboardData.getData('text/plain');
  if (t.classList.contains('one')) text = text.replace(/\s*\n\s*/g, ' ');
  document.execCommand('insertText', false, text);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.isContentEditable && t.textContent === '') t.innerHTML = '';
});

/* ---------- 형광펜 / 볼드 ---------- */
const fmt = $('#fmtBar');
function currentRich(){
  const sel = getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return null;
  const n = sel.anchorNode;
  const el = n && (n.nodeType === 1 ? n : n.parentElement);
  return el ? el.closest('.rich') : null;
}
function updateFmt(){
  if (!currentRich()){ fmt.classList.remove('show'); return; }
  const r = getSelection().getRangeAt(0).getBoundingClientRect();
  fmt.style.left = clamp(r.left + r.width / 2, 120, innerWidth - 120) + 'px';
  fmt.style.top = Math.max(r.top, 60) + 'px';
  $('[data-cmd=bold]', fmt).classList.toggle('on', document.queryCommandState('bold'));
  fmt.classList.add('show');
}
document.addEventListener('selectionchange', updateFmt);
window.addEventListener('scroll', updateFmt, true);
fmt.addEventListener('pointerdown', e => e.preventDefault());
fmt.addEventListener('mousedown', e => e.preventDefault());
fmt.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !currentRich()) return;
  document.execCommand('styleWithCSS', false, true);
  if (b.dataset.cmd === 'bold') document.execCommand('bold');
  else if (b.dataset.hl) document.execCommand('hiliteColor', false, b.dataset.hl);
  else if (b.dataset.cmd === 'clear'){
    document.execCommand('hiliteColor', false, 'transparent');
    document.execCommand('removeFormat');
  }
  updateFmt();
});

/* ---------- 스티커 (투명 PNG) ---------- */
const layer = $('#stickerLayer');
let selected = null, zTop = 10;
const select = s => { if (selected && selected !== s) selected.classList.remove('sel'); selected = s; if (s){ s.classList.add('sel'); s.style.zIndex = ++zTop; } };
function applySticker(d){
  const s = d._st;
  d.style.width = s.w + 'px'; d.style.height = s.w * s.ratio + 'px';
  d.style.left = s.x - s.w / 2 + 'px'; d.style.top = s.y - s.w * s.ratio / 2 + 'px';
  d.style.transform = `rotate(${s.rot}deg)`;
}
function addSticker(src, offset){
  const im = new Image();
  im.onload = () => {
    const d = document.createElement('div');
    d.className = 'sticker';
    d.innerHTML = `<img src="${src}" alt="" draggable="false">
      <span class="stk-h stk-del" data-html2canvas-ignore title="삭제">×</span>
      <span class="stk-h stk-rot" data-html2canvas-ignore title="회전">↻</span>
      <span class="stk-h stk-size" data-html2canvas-ignore title="크기">⤡</span>`;
    const cr = card.getBoundingClientRect();
    d._st = {
      x: clamp(innerWidth / 2 - cr.left, 100, card.offsetWidth - 100) + offset,
      y: clamp(innerHeight / 2 - cr.top, 100, card.offsetHeight - 100) + offset,
      w: Math.min(180, im.naturalWidth), ratio: im.naturalHeight / im.naturalWidth, rot: 0
    };
    applySticker(d); layer.appendChild(d); bindSticker(d); select(d);
  };
  im.src = src;
}
function bindSticker(d){
  let mode = null, start = null;
  d.addEventListener('pointerdown', e => {
    e.stopPropagation();
    if (e.target.classList.contains('stk-del')){ d.remove(); selected = null; return; }
    select(d);
    const s = d._st, cr = card.getBoundingClientRect();
    const cx = cr.left + s.x, cy = cr.top + s.y;
    mode = e.target.classList.contains('stk-size') ? 'size' : e.target.classList.contains('stk-rot') ? 'rot' : 'move';
    start = { x:e.clientX, y:e.clientY, sx:s.x, sy:s.y, w:s.w, rot:s.rot, cx, cy,
      dist: Math.hypot(e.clientX - cx, e.clientY - cy) || 1,
      ang: Math.atan2(e.clientY - cy, e.clientX - cx) };
    d.setPointerCapture(e.pointerId);
  });
  d.addEventListener('pointermove', e => {
    if (!mode) return;
    const s = d._st;
    if (mode === 'move'){ s.x = start.sx + e.clientX - start.x; s.y = start.sy + e.clientY - start.y; }
    else if (mode === 'size'){ s.w = clamp(start.w * Math.hypot(e.clientX - start.cx, e.clientY - start.cy) / start.dist, 24, 2400); }
    else {
      let r = start.rot + (Math.atan2(e.clientY - start.cy, e.clientX - start.cx) - start.ang) * 180 / Math.PI;
      if (e.shiftKey) r = Math.round(r / 15) * 15;
      s.rot = r;
    }
    applySticker(d);
  });
  const end = () => { mode = null; };
  d.addEventListener('pointerup', end); d.addEventListener('pointercancel', end);
  d.addEventListener('wheel', e => {
    e.preventDefault(); select(d);
    d._st.w = clamp(d._st.w * Math.exp(-e.deltaY * 0.0015), 24, 2400); applySticker(d);
  }, { passive:false });
}
$('#addSticker').addEventListener('click', () => $('#stickerInput').click());
$('#stickerInput').addEventListener('change', e => {
  [...e.target.files].forEach((f, i) => {
    const r = new FileReader(); r.onload = () => addSticker(r.result, i * 24); r.readAsDataURL(f);
  });
  e.target.value = '';
});
document.addEventListener('pointerdown', e => { if (!e.target.closest('.sticker')) select(null); });
document.addEventListener('keydown', e => {
  if (!selected) return;
  const a = document.activeElement;
  if (a && (a.isContentEditable || a.tagName === 'INPUT')) return;
  if (e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); selected.remove(); selected = null; }
});

/* ---------- 저장용 형광펜 보정 ----------
   html2canvas는 여러 줄에 걸친 형광펜을 한 덩어리 사각형으로 칠해서
   같은 줄의 앞 글자를 덮어버림. 저장용 복제본에서만 형광펜을
   줄 단위 조각으로 쪼개 글자 뒤에 깔아 준다. */
function flattenHighlights(root){
  const win = root.ownerDocument.defaultView;
  const hasBg = n => { const c = win.getComputedStyle(n).backgroundColor; return c && c !== 'transparent' && !/,\s*0\)$/.test(c); };
  root.querySelectorAll('.t-body').forEach(body => {
    const marks = [...body.querySelectorAll('*')].filter(hasBg);
    if (!marks.length) return;
    body.style.position = 'relative'; body.style.zIndex = '0';
    const br = body.getBoundingClientRect();
    const pieces = [];
    marks.forEach(m => {
      const bg = win.getComputedStyle(m).backgroundColor;
      [...m.getClientRects()].forEach(r => { if (r.width > 0) pieces.push({ r, bg }); });
    });
    marks.forEach(m => { m.style.backgroundColor = 'transparent'; });
    pieces.forEach(({ r, bg }) => {
      const d = root.ownerDocument.createElement('div');
      Object.assign(d.style, { position:'absolute', left:(r.left - br.left) + 'px', top:(r.top - br.top) + 'px',
        width:r.width + 'px', height:r.height + 'px', background:bg, zIndex:'-1', pointerEvents:'none' });
      body.appendChild(d);
    });
  });
}

/* ---------- PNG 저장 ---------- */
$('#savePng').addEventListener('click', async () => {
  const btn = $('#savePng');
  if (typeof html2canvas === 'undefined'){ toast('저장 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'); return; }
  btn.disabled = true;
  select(null); Picker.close(); fmt.classList.remove('show');
  if (document.activeElement) document.activeElement.blur();
  getSelection().removeAllRanges();
  const sx = scrollX, sy = scrollY, stage = $('.stage'), sl = stage.scrollLeft;
  try {
    await document.fonts.ready;
    window.scrollTo(0, 0); stage.scrollLeft = 0;
    $$('.credit', card).forEach(c => c.classList.toggle('blank', !$('.c-text', c).textContent.trim()));
    card.classList.add('exporting');
    const canvas = await html2canvas(card, { scale:2, backgroundColor:'#ffffff', logging:false, useCORS:true,
      onclone: doc => flattenHighlights(doc.getElementById('card')) });
    const names = $$('.name', card).map(n => n.textContent.trim()).filter(Boolean);
    const a = document.createElement('a');
    a.download = (names.join('_') || 'character-profile').replace(/[\\/:*?"<>|]/g, '') + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
    toast('PNG로 저장했어요.');
  } catch (err){
    console.error(err); toast('저장하지 못했어요. 다시 시도해 주세요.');
  } finally {
    card.classList.remove('exporting');
    window.scrollTo(sx, sy); stage.scrollLeft = sl;
    btn.disabled = false;
  }
});
</script>
